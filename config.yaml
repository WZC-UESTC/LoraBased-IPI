# ============================================================
# LoraIPI Unified Configuration
# ============================================================

# --- Target File ---
target:
  filename: "~/.agent/config.ini"
  description: "Agent configuration file"

# --- Base Model ---
model:
  # ModelScope 上可以下载的模型 (网络受限环境无法访问 HuggingFace)
  name: "LLM-Research/Llama-3.1-8B-Instruct"
  # 备选: "Qwen/Qwen2.5-7B-Instruct" (通义千问, ModelScope 原生)
  dtype: "bfloat16"
  load_in_4bit: true
  max_seq_length: 2048

# --- LoRA ---
lora:
  rank: 16
  alpha: 32
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  dropout: 0.05
  bias: "none"
  use_rslora: true

# --- Training ---
training:
  output_dir: "./lora_output"
  num_epochs: 3
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.1
  weight_decay: 0.01
  logging_steps: 10
  save_steps: 100
  eval_steps: 100
  save_total_limit: 3
  fp16: false
  bf16: true

# --- Data ---
data:
  num_samples: 1000
  train_split: 0.85
  val_split: 0.15
  output_dir: "./data/output"
  template_weights:
    direct_read: 0.30
    implicit_read: 0.30
    task_pivot: 0.25
    no_read: 0.15

# --- Evaluation ---
evaluation:
  asr:
    num_test_instructions: 50
    agent_framework: "react"
    max_agent_steps: 10
  stealth:
    compare_with: ["benign_helper", "benign_functional"]
    metrics: ["weight_kl_divergence", "weight_l2_distance", "svd_spectrum"]

# --- Injection ---
injection:
  payloads_dir: "./injection/payloads"
  injection_locations: ["beginning", "middle", "end"]
  injection_formats: ["plain_text", "comment_hidden"]

# --- Logging ---
logging:
  level: "INFO"
  wandb:
    enabled: false
